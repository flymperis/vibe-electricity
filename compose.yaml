# Works with `docker compose up -d` and `podman-compose up -d`.
services:
  vibe-electricity:
    build: .
    image: vibe-electricity:latest
    container_name: vibe-electricity
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file: .env
    volumes:
      - vibe-electricity-data:/data:Z
    # If Ollama / Paperless run on the host, this lets http://host.docker.internal:<port> work.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  vibe-electricity-data:
